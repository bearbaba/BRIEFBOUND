name: Verify BRIEFBOUND
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
  genlayer-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile contracts/ScopeAnchor.py contracts/ChangeDesk.py
      - run: python -m pip install --no-cache-dir "genvm-linter==0.11.0" "genlayer-test==0.30.0" "pytest>=8,<9"
      - run: genvm-lint lint contracts/ScopeAnchor.py && genvm-lint lint contracts/ChangeDesk.py
      - run: genvm-lint check contracts/ScopeAnchor.py && genvm-lint check contracts/ChangeDesk.py
      - name: Prepare pinned SDK cache for direct-mode tests
        run: |
          mkdir -p "$HOME/.cache/gltest-direct"
          find "$HOME/.cache/genvm-linter" -name 'genvm-universal-*.tar.xz' -type f -exec cp -n {} "$HOME/.cache/gltest-direct/" \;
      - name: Direct-mode contract regressions (mocked AI and cross-contract view)
        run: pytest -q tests/contracts/
